<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <!-- Top Red-White Ribbon -->
  <rect x="0" y="0" width="1080" height="24" fill="#D9272D" />
  <rect x="0" y="24" width="1080" height="24" fill="#FFFFFF" />

  <!-- Outer Metallic Gold Border -->
  <rect x="25" y="25" width="1030" height="1030" fill="none" stroke="#F59E0B" stroke-width="16" rx="20" />
  <rect x="40" y="40" width="1000" height="1000" fill="none" stroke="#FDE047" stroke-width="4" rx="16" />

  <!-- Bottom Dark Gradient Overlay for Text -->
  <defs>
    <linearGradient id="bottomGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0F19" stop-opacity="0" />
      <stop offset="60%" stop-color="#0B0F19" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0.98" />
    </linearGradient>
    <linearGradient id="goldTextGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <rect x="0" y="600" width="1080" height="480" fill="url(#bottomGrad)" />

  <!-- Top Right 81 Badge Emblem -->
  <g transform="translate(940, 140)">
    <circle cx="0" cy="0" r="70" fill="#D9272D" stroke="#F59E0B" stroke-width="6" />
    <circle cx="0" cy="0" r="60" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6,4" />
    <text x="0" y="18" fill="#FFFFFF" font-family="sans-serif" font-size="52" font-weight="900" text-anchor="middle">81</text>
  </g>

  <!-- Bottom Decorative Corner Ornaments -->
  <path d="M 40,940 L 40,1040 L 140,1040" fill="none" stroke="#F59E0B" stroke-width="12" />
  <path d="M 1040,940 L 1040,1040 L 940,1040" fill="none" stroke="#F59E0B" stroke-width="12" />

  <!-- Bottom Banner Typography -->
  <text x="540" y="930" fill="#F59E0B" font-family="sans-serif" font-size="34" font-weight="700" text-anchor="middle" letter-spacing="4">
    NUSANTARA BARU, INDONESIA MAJU
  </text>
  <text x="540" y="995" fill="url(#goldTextGrad)" font-family="sans-serif" font-size="58" font-weight="900" text-anchor="middle" letter-spacing="2">
    PERAYAAN HUT RI KE-81
  </text>
</svg>
