<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <!-- Top Diagonal Red-White Ribbon Corner -->
  <path d="M 0,0 L 400,0 L 0,400 Z" fill="#D9272D" />
  <path d="M 0,400 L 400,0 L 450,0 L 0,450 Z" fill="#FFFFFF" />

  <!-- Outer Red & Gold Border -->
  <rect x="25" y="25" width="1030" height="1030" fill="none" stroke="#D9272D" stroke-width="16" rx="20" />
  <rect x="40" y="40" width="1000" height="1000" fill="none" stroke="#F59E0B" stroke-width="6" rx="16" />

  <!-- Bottom Dark Gradient Overlay for Text -->
  <defs>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#600C0E" stop-opacity="0" />
      <stop offset="70%" stop-color="#600C0E" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0.98" />
    </linearGradient>
  </defs>

  <rect x="0" y="650" width="1080" height="430" fill="url(#redGrad)" />

  <!-- Top Right Flag Ribbon Badge -->
  <g transform="translate(940, 140)">
    <rect x="-80" y="-35" width="160" height="35" fill="#D9272D" rx="4" />
    <rect x="-80" y="0" width="160" height="35" fill="#FFFFFF" rx="4" />
    <text x="0" y="10" fill="#0B0F19" font-family="sans-serif" font-size="28" font-weight="900" text-anchor="middle">RI 81</text>
  </g>

  <!-- Bottom Banner Typography -->
  <text x="540" y="940" fill="#FDE047" font-family="sans-serif" font-size="36" font-weight="800" text-anchor="middle" letter-spacing="4">
    GELORA KEMERDEKAAN 81
  </text>
  <text x="540" y="1005" fill="#FFFFFF" font-family="sans-serif" font-size="54" font-weight="900" text-anchor="middle" letter-spacing="2">
    17 AGUSTUS 2026 • MERDEKA!
  </text>
</svg>
